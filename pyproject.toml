[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-assistant"
version = "0.1.0"
description = "RAG-based troubleshooting assistant for payment systems (internship MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "gradio>=4.44",
    "requests>=2.31",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
