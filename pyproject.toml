[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payment-assistant"
version = "0.1.0"
description = "RAG-based troubleshooting assistant for payment systems (internship MVP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic-settings>=2.2",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "requests>=2.31",
    "numpy>=1.26",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
# httpx is required by starlette.testclient (TestClient), not by the app itself.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "httpx>=0.27,<0.29"]

[tool.setuptools.packages.find]
where = ["src"]

# The web UI ships as static assets inside the package, so `pip install .` (what the
# Dockerfile does) must carry them into the wheel. Extensions are listed explicitly so an
# editor backup or a stray .env in that directory can never be packaged.
[tool.setuptools.package-data]
"payment_assistant.ui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Long lines here are markdown-table prose inside corpus-content string literals,
# not code — wrapping them would break the tables for no readability gain.
"src/payment_assistant/datagen.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/", "scripts/", "eval/"]

[tool.coverage.run]
source = ["payment_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
# Launch/CLI glue and defensive branches that aren't meaningful to unit-test.
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
