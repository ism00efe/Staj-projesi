# Optional observability stack: Prometheus (scrapes /metrics) + Grafana (dashboards).
# Decoupled from the core app on purpose — the main docker-compose.yml stays free of a
# monitoring stack; this is an overlay you opt into.
#
# Usage:
#   1. Ensure the app exposes metrics:  set METRICS_ENABLED=true (env or docker-compose.yml)
#   2. docker compose -f docker-compose.yml -f docker-compose.observability.yml up
#   3. Prometheus:  http://localhost:9091
#      Grafana:     http://localhost:3000  (login admin / admin, then add Prometheus at
#                    http://prometheus:9090 as a data source)

services:
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"   # host 9091 -> avoid clashing with the app's own 9090 mapping
    depends_on:
      - app

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  grafana-data:
